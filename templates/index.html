<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>PiMusic</title>
  <link rel="stylesheet" href="/static/style.css?v=63">
</head>
<body data-demo="{{ '1' if demo_mode else '0' }}">
  {% if demo_mode %}<div class="demo-banner">DEMO MODE</div>{% endif %}
  <!-- Full-screen blurred background layer -->
  <div id="bg-layer" class="bg-layer"></div>
  <div id="bg-overlay" class="bg-overlay"></div>

  <main class="player">
    <!-- Connection / device badge -->
    <div class="topbar">
      <div class="source-dropdown-wrap">
        <span id="source-badge" class="source-badge source-spotify" title="Playback source">
          <svg id="source-icon-spotify" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.6 0 12 0zm5.5 17.3c-.2.3-.6.4-1 .2-2.7-1.6-6-2-10-1.1-.4.1-.7-.2-.8-.5-.1-.4.2-.7.5-.8 4.3-1 8-.6 11 1.2.4.2.5.6.3 1zm1.5-3.3c-.3.4-.8.5-1.2.3-3-1.9-7.7-2.4-11.3-1.3-.4.1-.9-.1-1-.6-.1-.4.1-.9.6-1 4.1-1.3 9.2-.7 12.6 1.5.3.2.5.7.3 1.1zm.1-3.4C15.7 8.5 9.1 8.3 5.3 9.4c-.5.2-1-.2-1.2-.7-.1-.5.2-1 .7-1.2C9 6.2 16.3 6.4 20.7 8.8c.5.3.6.9.4 1.4-.3.4-.9.6-1.4.3z"/></svg>
          <svg id="source-icon-cider" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" class="hidden"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
          <span id="source-label">Spotify</span>
          <svg class="source-arrow" width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
        </span>
        <div id="source-dropdown" class="source-dropdown hidden">
          <div class="source-option" data-source="spotify">Spotify</div>
          <div class="source-option" data-source="cider">Apple Music</div>
        </div>
      </div>
      <span id="device-badge" class="device-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3Zm7 11a7 7 0 0 1-14 0H3a9 9 0 0 0 8 8.94V23h2v-2.06A9 9 0 0 0 21 12Z"/></svg>
        <span id="device-name">Connecting…</span>
      </span>
      <button id="lyrics-btn" class="topbar-icon-btn" title="Lyrics" aria-label="Lyrics">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 5v14h6l3 3 3-3h6V5H3zm8 11H6v-2h5v2zm7-4H6v-2h12v2zm0-4H6V6h12v2z"/></svg>
      </button>
      <button id="library-btn" class="topbar-icon-btn" title="Search &amp; Library" aria-label="Search and Library">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.49 4.49 0 0 1 9.5 14z"/></svg>
      </button>
      <a href="/settings" class="settings-link" title="Settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
      </a>
    </div>

    <!-- Album art + canvas video overlay -->
    <div class="artwork-wrap" id="artwork-wrap">
      <img id="album-art" class="album-art" src="" alt="Album Art">
      <video id="canvas-video" class="canvas-video" autoplay loop muted playsinline preload="auto" disablepictureinpicture></video>
    </div>

    <!-- Track info -->
    <div class="track-info">
      <div class="track-text">
        <div id="track-title" class="track-title">—</div>
        <div id="track-artist" class="track-artist">—</div>
      </div>
      <button id="btn-like" class="like-btn hidden" aria-label="Save to Liked Songs">
        <svg id="icon-heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <svg id="icon-heart-filled" viewBox="0 0 24 24" fill="currentColor" class="hidden"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </button>
    </div>

    <!-- Progress bar -->
    <div class="progress-wrap">
      <span id="time-current" class="time">0:00</span>
      <div id="progress-bar" class="progress-bar">
        <div id="progress-fill" class="progress-fill"></div>
        <div id="progress-thumb" class="progress-thumb"></div>
      </div>
      <span id="time-total" class="time">0:00</span>
    </div>

    <!-- Playback controls (Spotify order: shuffle, prev, play, next, repeat) -->
    <div class="controls">
      <button id="btn-shuffle" class="ctrl-btn ctrl-btn--mode" aria-label="Shuffle">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.14L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
      </button>
      <button id="btn-prev" class="ctrl-btn" aria-label="Previous">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button id="btn-play" class="ctrl-btn ctrl-btn--play" aria-label="Play/Pause">
        <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="icon-pause" viewBox="0 0 24 24" fill="currentColor" class="hidden"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg>
      </button>
      <button id="btn-next" class="ctrl-btn" aria-label="Next">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm10-12v12h2V6z"/></svg>
      </button>
      <button id="btn-repeat" class="ctrl-btn ctrl-btn--mode" aria-label="Repeat">
        <svg id="icon-repeat" viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
        <svg id="icon-repeat-one" viewBox="0 0 24 24" fill="currentColor" class="hidden"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-2V9h-1l-2 1v1h1.5v4H13z"/></svg>
      </button>
    </div>

    <!-- Volume -->
    <div class="volume-wrap">
      <svg class="vol-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8.5v7a4.49 4.49 0 0 0 2.5-3.5zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06A9 9 0 0 0 14 3.23z"/></svg>
      <input id="volume-slider" type="range" min="0" max="100" value="50" class="volume-slider">
    </div>
  </main>

  <!-- Library overlay (search / playlists / liked / queue) -->
  <div id="library-overlay" class="overlay hidden">
    <div class="overlay-header">
      <div class="lib-tabs">
        <button class="lib-tab lib-tab--active" data-tab="search">Search</button>
        <button class="lib-tab" data-tab="playlists">Playlists</button>
        <button class="lib-tab" data-tab="liked">Liked</button>
        <button class="lib-tab" data-tab="queue">Queue</button>
      </div>
      <button id="library-close" class="overlay-close" aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>
    <div id="lib-body" class="lib-body">
      <div id="lib-searchbar" class="lib-searchbar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" class="lib-searchbar-icon"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.49 4.49 0 0 1 9.5 14z"/></svg>
        <div id="lib-query" class="lib-query"><span class="lib-query-placeholder">Search Spotify…</span></div>
      </div>
      <div id="lib-content" class="lib-content"></div>
      <div id="lib-keyboard" class="lib-keyboard"></div>
    </div>
  </div>

  <!-- Lyrics overlay -->
  <div id="lyrics-overlay" class="overlay hidden">
    <div id="lyrics-bg" class="lyrics-bg"></div>
    <div class="lyrics-scrim"></div>
    <div class="overlay-header">
      <div class="lyrics-head">
        <div id="lyrics-track-title" class="lyrics-head-title">Lyrics</div>
        <div id="lyrics-track-sub" class="lyrics-head-sub"></div>
      </div>
      <div class="overlay-header-actions">
        <button id="lyrics-search-btn" class="overlay-close" type="button" title="Search" aria-label="Search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.49 4.49 0 0 1 9.5 14z"/></svg>
        </button>
        <button id="lyrics-close" class="overlay-close" type="button" aria-label="Close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
    </div>
    <div id="lyrics-content" class="lyrics-content"></div>
    <div class="lyrics-transport-wrap">
      <div class="lyrics-time" aria-live="polite">
        <span id="lyrics-time-current">0:00</span>
        <span class="lyrics-time-sep">/</span>
        <span id="lyrics-time-total">0:00</span>
      </div>
      <div class="lyrics-transport" aria-label="Playback controls">
      <button id="lyrics-btn-prev" class="lyrics-transport-btn" type="button" aria-label="Previous">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button id="lyrics-btn-play" class="lyrics-transport-btn lyrics-transport-btn--main" type="button" aria-label="Play/Pause">
        <svg id="lyrics-icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="lyrics-icon-pause" viewBox="0 0 24 24" fill="currentColor" class="hidden"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg>
      </button>
      <button id="lyrics-btn-next" class="lyrics-transport-btn" type="button" aria-label="Next">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm10-12v12h2V6z"/></svg>
      </button>
      </div>
      <div class="lyrics-volume-wrap">
        <svg class="vol-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8.5v7a4.49 4.49 0 0 0 2.5-3.5zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06A9 9 0 0 0 14 3.23z"/></svg>
        <input id="lyrics-volume-slider" type="range" min="0" max="100" value="50" class="volume-slider lyrics-volume-slider" aria-label="Volume">
      </div>
    </div>
  </div>

  <div id="pim-toast" class="pim-toast hidden"></div>

  <script src="/static/app.js?v=63"></script>
  <script src="/static/library.js?v=63"></script>
  <script src="/static/lyrics.js?v=63"></script>
</body>
</html>
